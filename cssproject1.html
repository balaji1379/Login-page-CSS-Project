<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        box-sizing: border-box;
       }
       body{
           margin: 0;
           padding: 0;
           font-family: cursive;
           background-color: rgb(97, 97, 236);
       }
       .log{
        width: 300px;
        padding: 20px ;
        margin: 150px auto;
        background-color: rgb(253, 253, 253);
        border: 3px solid black;
        border-radius: 20px;
        color: black;
       }
       .log h2{
        margin-top: 0;
        margin-bottom: 25px;
        text-align: center;
       }
       .email{
        margin-bottom: 25px;
       }
       label{
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
       }
       input{
        width: 100%;
        border: 3px solid black;
        padding: 10px;
        border-radius: 30px;
       }
       .password{
        margin-bottom: 10px;
       }
       button{
        margin-top: 10px;
        width:100%;
        border: solid black;
        border-radius: 20px ;
        margin-bottom: 10px ;
        padding: 10px;
        background-color:rgb(0, 0, 128);;
        color: white;
        cursor: pointer;
       }
       button:hover{
        background-color:white;
        color: black;
       }
       .forgot{
        margin-top: 10px;
        text-align: center;
       }
       a{
        text-decoration: none;
        color: black;
        font-weight: bold;
       }
       a:hover{
        text-decoration: underline;
       }
    </style>
</head>
<body>
    <div class="log">
    <h2>Login Page</h2>
    <form>
        <div class="email">
            <label>Email</label>
            <input type="email" placeholder="Enter Email">
        </div>
        <div class="password">
            <label>Password</label>
            <input type="password" placeholder="Enter Password">
        </div>
        <button type="submit">Login</button>
    </form>
    <div class="forgot">
    <a href="#">Forgot Password ?</a>
    </div>
    </div>
</body>
</html>
